name: 知识库校验

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 检查 Python 语法
        run: python -m compileall -q tools
      - name: 校验知识库
        run: python tools/kb_integrity_test.py
      - name: 校验图形题映射
        run: python tools/verify_figures.py
